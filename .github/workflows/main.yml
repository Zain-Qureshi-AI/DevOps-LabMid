
name: DevOps CI Pipeline

on:
  push:

jobs:
  test:
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install -r requirements.txt

      - name: Run automated tests
        id: tests
        shell: powershell
        continue-on-error: true
        run: |
          python -m pytest tests/ -v --json-report --json-report-file=pytest-results.json
          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

      - name: Generate JSON report
        if: always()
        shell: powershell
        run: |
          python generate_report.py

      - name: Send report to localhost
        if: always()
        shell: powershell
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          python send_report.py

      - name: Enforce test result
        if: always()
        shell: powershell
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if ($env:TEST_OUTCOME -ne "success") {
            Write-Error "Automated tests failed"
            exit 1
          }
