
name: DevOps CI Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-json-report requests

      # Step 4: Run automated tests
      - name: Run Automated Tests
        id: pytest
        continue-on-error: true
        run: |
          python -m pytest tests/ -v \
            --json-report \
            --json-report-file=test-report.json

      # Step 5: Generate custom CI JSON report
      - name: Generate CI Report
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.head_ref || github.ref_name }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python generate_report.py

      # Step 6: Upload reports as artifacts
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DevOps-Test-Reports
          path: |
            test-report.json
            ci-test-report.json
          if-no-files-found: warn

      # Step 7: Send report to local receiver
      - name: Send Report to Local Receiver
        if: always()
        continue-on-error: true
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          if [ -z "$RECEIVER_URL" ] || [ -z "$REPORT_TOKEN" ]; then
            echo "Receiver URL or token not configured."
            exit 1
          fi
          python send_report.py

      # Step 8: Check test result
      - name: Check Test Result
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          if [ "$TEST_OUTCOME" != "success" ]; then
            echo "Automated tests FAILED!"
            exit 1
          fi

          echo "All automated tests PASSED!"
